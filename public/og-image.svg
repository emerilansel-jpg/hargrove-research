<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101B3C"/>
      <stop offset="100%" stop-color="#0A1128"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E09543"/>
      <stop offset="100%" stop-color="#C97B2D"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B7CF9"/>
      <stop offset="100%" stop-color="#6D5DF6"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.8" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#6D5DF6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6D5DF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.2" cy="0.7" r="0.4">
      <stop offset="0%" stop-color="#E09543" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#E09543" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Grid -->
  <g opacity="0.04" stroke="#C7D0E8" stroke-width="1">
    <line x1="0" y1="78" x2="1200" y2="78"/>
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="236" x2="1200" y2="236"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="394" x2="1200" y2="394"/>
    <line x1="0" y1="473" x2="1200" y2="473"/>
    <line x1="0" y1="552" x2="1200" y2="552"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Logo mark (Signal Bridge H) -->
  <g transform="translate(80, 62)">
    <path d="M2 6 L2 42" stroke="#C7D0E8" stroke-width="5" stroke-linecap="round"/>
    <path d="M46 6 L46 42" stroke="#C7D0E8" stroke-width="5" stroke-linecap="round"/>
    <path d="M2 28 L14 28 L24 16 L34 28 L46 28" stroke="#C7D0E8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="24" cy="16" r="5" fill="url(#copper)"/>
  </g>
  <text x="140" y="100" font-family="Georgia, serif" font-size="22" font-weight="600" fill="#FBFAF7">Hargrove Research Group</text>
  <text x="140" y="100" font-family="Georgia, serif" font-size="22" font-weight="600" fill="#E09543" opacity="0">·</text>
  <text x="141" y="100" font-family="'Courier New', monospace" font-size="11" fill="#E09543" letter-spacing="3" opacity="0.8">  EST. 2019</text>

  <!-- Main headline -->
  <text x="80" y="280" font-family="Georgia, serif" font-size="72" font-weight="500" fill="#FBFAF7" letter-spacing="-2">
    Where AI claims meet
  </text>
  <text x="80" y="370" font-family="Georgia, serif" font-size="72" font-weight="400" font-style="italic" fill="url(#copper)" letter-spacing="-2">
    verified evidence.
  </text>

  <!-- Sub -->
  <text x="80" y="440" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="rgba(199,208,232,0.7)">
    Independent benchmarks · Deployment analysis · Governance research
  </text>

  <!-- Stats row -->
  <g transform="translate(80, 500)">
    <g>
      <text font-family="Georgia, serif" font-size="36" font-weight="600" fill="#FBFAF7">500+</text>
      <text y="28" font-family="'Courier New', monospace" font-size="12" fill="rgba(199,208,232,0.5)" letter-spacing="1.5">MODELS EVALUATED</text>
    </g>
    <g transform="translate(220, 0)">
      <text font-family="Georgia, serif" font-size="36" font-weight="600" fill="#FBFAF7">42</text>
      <text y="28" font-family="'Courier New', monospace" font-size="12" fill="rgba(199,208,232,0.5)" letter-spacing="1.5">BENCHMARKS</text>
    </g>
    <g transform="translate(380, 0)">
      <text font-family="Georgia, serif" font-size="36" font-weight="600" fill="#FBFAF7">96%</text>
      <text y="28" font-family="'Courier New', monospace" font-size="12" fill="rgba(199,208,232,0.5)" letter-spacing="1.5">PREDICTION ACCURACY</text>
    </g>
    <g transform="translate(620, 0)">
      <text font-family="Georgia, serif" font-size="36" font-weight="600" fill="#FBFAF7">180+</text>
      <text y="28" font-family="'Courier New', monospace" font-size="12" fill="rgba(199,208,232,0.5)" letter-spacing="1.5">VENDOR ASSESSMENTS</text>
    </g>
  </g>

  <!-- Mini chart in corner -->
  <g transform="translate(880, 200)" opacity="0.9">
    <rect x="-20" y="-20" width="260" height="200" rx="16" fill="rgba(27,42,82,0.4)" stroke="rgba(199,208,232,0.12)"/>
    <text x="-4" y="0" font-family="'Courier New', monospace" font-size="10" fill="#E09543" letter-spacing="2">READINESS INDEX</text>
    <text x="-4" y="16" font-family="Georgia, serif" font-size="14" fill="#FBFAF7">Q3 2026 · 24 platforms</text>
    <!-- Chart line -->
    <path d="M0,140 L25,125 L50,130 L75,110 L100,115 L125,95 L150,100 L175,80 L200,85 L225,60 L250,40"
          fill="none" stroke="url(#copper)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M0,140 L25,125 L50,130 L75,110 L100,115 L125,95 L150,100 L175,80 L200,85 L225,60 L250,40 L250,160 L0,160 Z"
          fill="url(#copper)" opacity="0.15"/>
    <circle cx="250" cy="40" r="5" fill="#E09543"/>
    <circle cx="250" cy="40" r="9" fill="#E09543" opacity="0.3"/>
  </g>

  <!-- Domain -->
  <text x="80" y="600" font-family="'Courier New', monospace" font-size="14" fill="rgba(199,208,232,0.4)" letter-spacing="2">HARGROVERESEARCH.COM</text>
</svg>
