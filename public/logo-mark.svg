<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 40" fill="none">
  <!-- Hargrove mark: H formed by two data-pillars connected by a rising signal line -->
  <defs>
    <linearGradient id="hg-copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E09543"/>
      <stop offset="100%" stop-color="#C97B2D"/>
    </linearGradient>
  </defs>
  <!-- Left pillar -->
  <path d="M4 4 L4 36" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  <!-- Right pillar -->
  <path d="M40 4 L40 36" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  <!-- Crossbar as ascending signal line (the "H" bridge doubles as a benchmark trend) -->
  <path d="M4 22 L16 22 L22 14 L28 22 L40 22" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Signal apex dot -->
  <circle cx="22" cy="14" r="3.5" fill="url(#hg-copper)"/>
</svg>
